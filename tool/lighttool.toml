[tool]
id = "io.github.vrlmvg.auth"
label = "Ente Auth"
versionCode = 1
versionName = "0.1.0"
permissions = []
# cleartext-http lets you reach a self-hosted Ente server on your home network over plain http.
capabilities = ["cleartext-http"]
# for the LightOS emulator, use the commented line instead and build with -DlightSdk.allowAltServerPackage=true
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
